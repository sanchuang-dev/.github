name: Sanchuang AI Review - OpenAI Compatible

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      endpoint:
        required: true
        type: string
      model:
        required: true
        type: string
    secrets:
      api_key:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Validate reusable workflow
        run: echo "workflow syntax is valid"
