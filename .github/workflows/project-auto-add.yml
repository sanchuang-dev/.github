name: Organization Project intake

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-auto-add.yml'

permissions:
  contents: read

concurrency:
  group: sanchuang-project-1-intake
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      ORG: sanchuang-dev
      PROJECT_NUMBER: '1'

    steps:
      - name: Validate Project access
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::Project #1 intake is inactive because ORG_GITHUB_TOKEN is not configured."
            exit 0
          fi

          gh project view "$PROJECT_NUMBER"             --owner "$ORG"             --format json             --jq '.id' >/dev/null

      - name: Add open Organization Issues
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            exit 0
          fi

          issues_file="$(mktemp)"
          project_file="$(mktemp)"

          gh api --paginate             -H 'Accept: application/vnd.github+json'             -H "X-GitHub-Api-Version: ${API_VERSION}"             "/search/issues?q=org%3A${ORG}+is%3Aissue+is%3Aopen&per_page=100"             --jq '.items[].html_url'             | sort -u > "$issues_file"

          gh project item-list "$PROJECT_NUMBER"             --owner "$ORG"             --limit 1000             --format json             --jq '.items[].content.url // empty'             | sort -u > "$project_file"

          added=0
          existing=0
          failed=0

          while IFS= read -r issue_url; do
            [ -n "${issue_url:-}" ] || continue

            if grep -Fxq "$issue_url" "$project_file"; then
              existing=$((existing + 1))
              continue
            fi

            echo "Adding $issue_url to Organization Project #1"
            if gh project item-add "$PROJECT_NUMBER"               --owner "$ORG"               --url "$issue_url" >/dev/null; then
              added=$((added + 1))
            else
              echo "::error::Failed to add $issue_url"
              failed=$((failed + 1))
            fi
          done < "$issues_file"

          echo "Project intake summary: added=$added existing=$existing failed=$failed"
          test "$failed" -eq 0

      - name: Repair reopened Issues left at Done
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            exit 0
          fi

          project_id="$(gh project view "$PROJECT_NUMBER" --owner "$ORG" --format json --jq '.id')"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$ORG" --format json)"
          status_field_id="$(jq -r '.fields[] | select(.name == "Status") | .id' <<<"$fields_json" | head -n 1)"
          todo_option_id="$(jq -r '.fields[] | select(.name == "Status") | .options[]? | select(.name == "Todo") | .id' <<<"$fields_json" | head -n 1)"

          [ -n "$project_id" ] && [ "$project_id" != "null" ]
          [ -n "$status_field_id" ] && [ "$status_field_id" != "null" ]
          [ -n "$todo_option_id" ] && [ "$todo_option_id" != "null" ]

          items_json="$(gh project item-list "$PROJECT_NUMBER" --owner "$ORG" --limit 1000 --format json)"

          jq -r '
            .items[]
            | select(.status == "Done")
            | select(.content.url != null)
            | [.id, .content.url]
            | @tsv
          ' <<<"$items_json" | while IFS=$'\t' read -r item_id issue_url; do
            [ -n "${item_id:-}" ] || continue
            [ -n "${issue_url:-}" ] || continue

            issue_path="${issue_url#https://github.com/}"
            issue_owner="${issue_path%%/*}"
            remainder="${issue_path#*/}"
            issue_repo="${remainder%%/*}"
            issue_number="${issue_url##*/}"

            [ "$issue_owner" = "$ORG" ] || continue
            [[ "$issue_number" =~ ^[0-9]+$ ]] || continue

            state_reason="$(gh api               -H 'Accept: application/vnd.github+json'               -H "X-GitHub-Api-Version: ${API_VERSION}"               "/repos/${issue_owner}/${issue_repo}/issues/${issue_number}"               --jq '.state_reason // ""')"

            [ "$state_reason" = "reopened" ] || continue

            echo "Repairing reopened $issue_url from Done to Todo"
            gh project item-edit               --id "$item_id"               --project-id "$project_id"               --field-id "$status_field_id"               --single-select-option-id "$todo_option_id" >/dev/null
          done
